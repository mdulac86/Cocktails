<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Concept : un carnet de bar. Deux onglets (Mon bar / Cocktails), recettes classées par niveau avec trois pastilles. Accent rouge Campari, neutres bleu-gris. */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --ink: #15202b;
  --muted: #5b6875;
  --line: #d3dae1;
  --accent: #b3263a;
  --on-accent: #ffffff;
  --accent-soft: #f6dde1;
  --ok: #1f7a55;
  --ok-soft: #d9efe5;
  --warn: #8f5a00;
  --warn-soft: #f5e8cc;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161d; --surface: #172029; --ink: #e8edf2; --muted: #93a1ae; --line: #27333e;
    --accent: #e0546a; --on-accent: #0f161d; --accent-soft: #3a1d25;
    --ok: #62c79b; --ok-soft: #14382b; --warn: #e3b25a; --warn-soft: #3b2d10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #172029; --ink: #e8edf2; --muted: #93a1ae; --line: #27333e;
  --accent: #e0546a; --on-accent: #0f161d; --accent-soft: #3a1d25;
  --ok: #62c79b; --ok-soft: #14382b; --warn: #e3b25a; --warn-soft: #3b2d10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 680px; margin: 0 auto; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1.05; margin: 0 0 4px; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 0.95rem; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.tab { border: 0; background: transparent; padding: 10px 4px; font-size: 0.93rem; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.tab .n { font-family: var(--f-mono); font-weight: 500; font-size: 0.8rem; margin-left: 6px; opacity: 0.85; }

.grp { margin: 0 0 22px; }
.grp h2 { font-family: var(--f-display); font-size: 1.05rem; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.grp h2 small { font-family: var(--f-mono); font-weight: 400; color: var(--muted); font-size: 0.78rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-size: 0.95rem; line-height: 1.1; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 9px 14px; color: var(--muted); }

.filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 0.92rem; min-height: 38px; }
.pill[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.surprise { align-self: flex-start; border: 0; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 600; }

.list { display: flex; flex-direction: column; gap: 10px; }
details.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.card[open] { border-color: var(--accent); }
details.card > summary { list-style: none; cursor: pointer; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
details.card > summary::-webkit-details-marker { display: none; }
.name { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; line-height: 1.15; min-width: 0; }
.meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.pips i.on { background: var(--accent); }
.tag { font-size: 0.78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; align-self: start; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.body { padding: 0 14px 16px; border-top: 1px solid var(--line); }
.body h3 { font-family: var(--f-mono); font-weight: 500; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 0 6px; }
.ing { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ing li { font-family: var(--f-mono); font-size: 0.88rem; }
.ing li.miss { color: var(--warn); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.tip { margin: 10px 0 0; padding: 10px 12px; background: var(--bg); border-radius: 10px; font-size: 0.9rem; color: var(--muted); }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 20px 16px; }
.empty b { font-family: var(--f-display); font-size: 1.1rem; display: block; margin-bottom: 4px; }
.empty p { margin: 0 0 12px; color: var(--muted); }
.foot { margin-top: 28px; color: var(--muted); font-size: 0.82rem; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.finder { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 22px; }
.finder h2 { font-family: var(--f-display); font-size: 1.05rem; margin: 0 0 10px; }
.frow { display: flex; flex-wrap: wrap; gap: 8px; }
.finder input, .finder select, .search { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 42px; min-width: 0; }
.finder input, .finder select { flex: 1 1 150px; }
.search { width: 100%; }
.add { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; min-height: 42px; }
.hint { font-size: 0.85rem; color: var(--warn); margin: 8px 0 0; min-height: 1.2em; }
.mybr { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.br { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 0.9rem; }
.br button { border: 0; background: transparent; color: var(--muted); padding: 6px 9px; min-height: 30px; }
.count { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); margin: 0 0 10px; }
.more { margin-top: 12px; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-weight: 600; }

.rate { display: flex; flex-direction: column; gap: 8px; }
.stars { display: flex; gap: 2px; margin-left: -6px; }
.star { border: 0; background: transparent; font-size: 1.7rem; line-height: 1; padding: 4px 6px; min-height: 42px; color: var(--line); }
.star.on { color: var(--accent); }
.rrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.madecount { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); }
.note { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; resize: vertical; }
.mine { color: var(--accent); font-weight: 600; }
.mine:empty { display: none; }
.act { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Bar à cocktails</h1>
  <p class="sub">Coche ce qu’il y a dans ton bar. L’appli te propose des cocktails simples, normaux ou compliqués.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-bar" aria-selected="true">Mon bar<span class="n" id="n-bar">0</span></button>
    <button class="tab" role="tab" id="tab-env" aria-selected="false">J’ai envie</button>
    <button class="tab" role="tab" id="tab-rec" aria-selected="false">Cocktails<span class="n" id="n-rec">0</span></button>
  </div>

  <section id="view-bar"></section>
  <section id="view-env" hidden></section>
  <section id="view-rec" hidden></section>

  <p class="foot">1 oz = 30 ml. Glace, sucre, sel et zeste sont considérés comme toujours disponibles.</p>
</main>

    var r = ratings[C[i][0]] || { s: 0, m: 0 };
    det.querySelectorAll(".star").forEach(function (b) {
      var k = +b.getAttribute("data-star");
      b.classList.toggle("on", k <= r.s);
      b.setAttribute("aria-pressed", String(k === r.s));
    });
    var mine = det.querySelector(".mine"); if (mine) mine.textContent = mineText(r);
    var mc = det.querySelector(".madecount"); if (mc) mc.textContent = r.m ? "Fait " + r.m + " fois" : "";
  }
  function handleRate(e) {
    var el = e.target.closest("[data-star],[data-made]");
    if (!el) return false;
    var i = +el.getAttribute("data-i"), r = ensure(C[i][0]);
    if (el.hasAttribute("data-star")) {
      var n = +el.getAttribute("data-star");
      r.s = r.s === n ? 0 : n;
    } else {
      r.m = Math.min(999, r.m + 1);
      r.d = new Date().toISOString().slice(0, 10);
    }
    queueSave(); paintRate(el.closest("details"), i);
    return true;
  }
  function handleNote(e) {
    var el = e.target.closest("[data-note]");
    if (!el) return;
    ensure(C[+el.getAttribute("data-i")][0]).n = el.value.slice(0, 500);
    queueSave();
  }

  function card(x, open) {
    var c = x.c, m = x.m, r = ratings[c[0]] || { s: 0, n: "", m: 0 };
    var tag = m.length === 0 ? '<span class="tag ok">Prêt</span>' : '<span class="tag warn">Manque ' + m.length + '</span>';
    var ing = c[4].map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("");
    var steps = c[5].map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");
    var miss = m.length ? '<div class="tip" style="color:var(--warn)">Il te manque : ' + esc(m.join(", ")) + '.</div>' : "";
    var stars = [1, 2, 3, 4, 5].map(function (k) {
      return '<button class="star' + (k <= r.s ? " on" : "") + '" data-star="' + k + '" data-i="' + x.i + '" aria-label="' + k + ' étoile' + (k > 1 ? "s" : "") + '" aria-pressed="' + (k === r.s) + '">★</button>';
    }).join("");
    var rate = '<h3>Mon avis</h3><div class="rate"><div class="stars">' + stars + '</div><div class="rrow"><button class="pill" data-made="1" data-i="' + x.i + '">Je l’ai fait</button><span class="madecount">' + (r.m ? "Fait " + r.m + " fois" : "") + '</span></div>' +
      '<textarea class="note" data-note="1" data-i="' + x.i + '" rows="2" maxlength="500" placeholder="Ma note : plus de lime, moins sucré…">' + esc(r.n) + '</textarea></div>';
    return '<details class="card"' + (open ? " open" : "") + '><summary><span class="name">' + esc(c[0]) + '</span>' + tag +
      '<span class="meta">' + pips(c[1]) + '<span>' + LV[c[1]] + '</span><span>' + esc(c[2]) + '</span><span class="mine">' + esc(mineText(r)) + '</span></span></summary>' +
      '<div class="body">' + miss + '<h3>Ingrédients</h3><ul class="ing">' + ing + '</ul><h3>Préparation</h3><ol class="steps">' + steps + '</ol>' +
      (c[6] ? '<p class="tip">' + esc(c[6]) + '</p>' : "") + rate + '</div></details>';
  }

  function fillList(openName) {
    var el = document.getElementById("recList");
    if (!el) return;
    var list = filtered();
    if (openName) {
      for (var i = 0; i < list.length; i++) if (list[i].c[0] === openName && i >= ui.limit) ui.limit = i + 1;
    }
    document.getElementById("recCount").textContent = list.length + " recette" + (list.length > 1 ? "s" : "");
    var html = "";
    if (have.size === 0 && ui.avail !== "all") {
      html = '<div class="empty"><b>Aucun article dans ton bar</b><p>Ajoute tes bouteilles dans l’onglet Mon bar pour voir ce que tu peux préparer.</p><button class="pill" id="goBar">Aller à Mon bar</button></div>';
    } else if (!list.length) {
      html = '<div class="empty"><b>Aucun résultat</b><p>Essaie un autre niveau ou une autre recherche, ou affiche les cocktails où il manque un seul article.</p></div>';
    } else {
      html = list.slice(0, ui.limit).map(function (x) { return card(x, x.c[0] === openName); }).join("");
      if (list.length > ui.limit) html += '<button class="more" id="more">Afficher plus (' + (list.length - ui.limit) + ' restantes)</button>';
    }
    el.innerHTML = html;
  }

  function renderRec(openName) {
    var cnt = counts();
    var html = '<div class="filters"><div class="row" id="lv">';
    ["Tous", "Simple", "Normal", "Compliqué"].forEach(function (l, i) {
      html += '<button class="pill" data-lv="' + i + '" aria-pressed="' + (ui.level === i) + '">' + l + '</button>';
    });
    html += '</div><div class="row" id="av">';
    [["ok", "Je peux les faire (" + cnt.ok + ")"], ["one", "Il manque 1 article (" + (cnt.ok + cnt.one) + ")"], ["all", "Tous (" + C.length + ")"]].forEach(function (a) {
      html += '<button class="pill" data-av="' + a[0] + '" aria-pressed="' + (ui.avail === a[0]) + '">' + a[1] + '</button>';
    });
    html += '</div><div class="row" id="mn">';
    [["all", "Tous"], ["made", "Déjà faits"], ["fav", "Favoris (4★ et +)"], ["new", "À essayer"]].forEach(function (a) {
      html += '<button class="pill" data-mn="' + a[0] + '" aria-pressed="' + (ui.mine === a[0]) + '">' + a[1] + '</button>';
    });
    html += '</div><input type="search" id="q" class="search" placeholder="Chercher un cocktail ou un ingrédient" value="' + esc(ui.q) + '" autocomplete="off">' +
      '<div class="row"><button class="surprise" id="rand">Surprends-moi</button></div></div>' +
      '<p class="count" id="recCount"></p><div class="list" id="recList"></div>';
    elRec.innerHTML = html;
    fillList(openName);
  }


  /* J'ai envie : choisir une bouteille et une vitesse, puis tourner les propositions */
  function usesBase(c, id) {
    return c[3].some(function (r) { return r.split("|").some(function (x) { return x === id || (SUB[x] || []).indexOf(id) > -1; }); });
  }
  function envPool() {
    return C.map(function (c, i) { return { c: c, i: i, m: missing(c) }; }).filter(function (x) {
      if (env.level && x.c[1] !== env.level) return false;
      if (x.m.length > (env.allowOne ? 1 : 0)) return false;
      if (env.base && !usesBase(x.c, env.base)) return false;
      if (env.newOnly) { var r = ratings[x.c[0]]; if (r && (r.m > 0 || r.s > 0)) return false; }
      return true;
    });
  }
  function rebuildQueue() {
    var q = envPool();
    for (var i = q.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), tmp = q[i]; q[i] = q[j]; q[j] = tmp; }
    function low(x) { var r = ratings[x.c[0]]; return r && r.s > 0 && r.s <= 2 ? 1 : 0; }
    q.sort(function (a, b) { return low(a) - low(b); });
    env.queue = q; env.pos = 0; env.wrapped = false;
  }
  function baseChips() {
    var out = [], covered = {};
    brands.forEach(function (b) { covered[b.id] = true; out.push([b.id, b.n]); });
    GROUPS.slice(0, 2).forEach(function (g) {
      g[1].forEach(function (p) {
        if (have.has(p[0]) && !covered[p[0]]) out.push([p[0], p[1].replace(/ \(.*\)$/, "")]);
      });
    });
    return out;
  }
  function renderEnv() {
    var html = '<div class="grp"><h2>Je veux boire</h2><div class="chips"><button class="chip" data-eb="" aria-pressed="' + (env.base === "") + '">Peu importe</button>';
    baseChips().forEach(function (b, i) {
      html += '<button class="chip" data-eb="' + b[0] + '" aria-pressed="' + (env.base === b[0]) + '">' + esc(b[1]) + '</button>';
    });
    html += '</div></div><div class="grp"><h2>Vitesse</h2><div class="row">';
    [[1, "Rapide"], [2, "Normal"], [3, "Élaboré"], [0, "Peu importe"]].forEach(function (l) {
      html += '<button class="pill" data-el="' + l[0] + '" aria-pressed="' + (env.level === l[0]) + '">' + l[1] + '</button>';
    });
    html += '</div></div><div class="grp"><div class="row">' +
      '<button class="pill" id="envNew" aria-pressed="' + env.newOnly + '">Seulement des nouveautés</button>' +
      '<button class="pill" id="envOne" aria-pressed="' + env.allowOne + '">Accepter 1 article manquant</button></div></div>' +
      '<div id="envRes"></div>';
    elEnv.innerHTML = html;
    fillEnv();
  }
  function fillEnv() {
    var el = document.getElementById("envRes");
    if (!el) return;
    var html = "";
    if (have.size === 0) {
      html = '<div class="empty"><b>Ton bar est vide</b><p>Ajoute tes bouteilles pour que je te propose quelque chose.</p><button class="pill" id="goBar">Aller à Mon bar</button></div>';
    } else if (!env.queue.length) {
      html = '<div class="empty"><b>Rien ne correspond</b><p>Essaie une autre vitesse, une autre bouteille, ou accepte un article manquant.</p></div>';
    } else {
      var x = env.queue[env.pos];
      html = '<p class="count">Proposition ' + (env.pos + 1) + ' sur ' + env.queue.length + (env.wrapped ? " · on recommence" : "") + '</p>' + card(x, true) +
        '<div class="row act"><button class="surprise" id="envNext">Un autre choix</button></div>';
    }
    el.innerHTML = html;
  }
  function nextChoice() {
    if (!env.queue.length) return;
    if (env.pos + 1 >= env.queue.length) {
      var last = env.queue[env.pos];
      rebuildQueue();
      if (env.queue.length > 1 && env.queue[0] === last) env.queue.push(env.queue.shift());
      env.wrapped = true;
    } else { env.pos++; env.wrapped = false; }
    fillEnv();
  }

  function updateCounts() {
    document.getElementById("n-bar").textContent = have.size;
    document.getElementById("n-rec").textContent = counts().ok;
  }
  function setTab(t) {
    ui.tab = t;
    tabBar.setAttribute("aria-selected", t === "bar");
    tabEnv.setAttribute("aria-selected", t === "env");
    tabRec.setAttribute("aria-selected", t === "rec");
    elBar.hidden = t !== "bar"; elEnv.hidden = t !== "env"; elRec.hidden = t !== "rec";
    if (t === "env") { rebuildQueue(); renderEnv(); }
    if (t === "rec") { ui.limit = 40; renderRec(); }
    window.scrollTo(0, 0);
  }
  function refresh() {
    updateCounts(); renderBar();
    if (ui.tab === "rec") renderRec();
    if (ui.tab === "env") { rebuildQueue(); renderEnv(); }
  }

  tabBar.onclick = function () { setTab("bar"); };
  tabEnv.onclick = function () { setTab("env"); };
  tabRec.onclick = function () { setTab("rec"); };

  function addBrand() {
    var inp = document.getElementById("brandIn"), cat = document.getElementById("brandCat"), hint = document.getElementById("hint");
    var name = inp.value.trim().slice(0, 60);
    if (!name) { hint.textContent = "Entre un nom de marque."; return; }
    if (!cat.value) { hint.textContent = "Choisis une catégorie pour cette bouteille."; return; }
    have.add(cat.value);
    brands.push({ n: name, id: cat.value });
    queueSave(); refresh();
  }

  elBar.addEventListener("input", function (e) {
    if (e.target.id === "brandIn") {
      var g = guess(e.target.value);
      if (g) document.getElementById("brandCat").value = g;
      document.getElementById("hint").textContent = "";
    }
  });
  elBar.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "brandIn") { e.preventDefault(); addBrand(); }
  });
  elBar.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (chip) {
      var id = chip.getAttribute("data-id");
      if (have.has(id)) have.delete(id); else have.add(id);
      chip.setAttribute("aria-pressed", have.has(id));
      var h = chip.closest(".grp");
      var g = GROUPS.filter(function (x) { return h.querySelector("h2").firstChild.textContent === x[0]; })[0];
      if (g) h.querySelector("small").textContent = g[1].filter(function (p) { return have.has(p[0]); }).length + " / " + g[1].length;
      updateCounts(); queueSave();
      var empty = elBar.querySelector(".empty");
      if (empty && have.size) empty.remove();
      return;
    }
    var rm = e.target.closest("[data-rm]");
    if (rm) { brands.splice(+rm.getAttribute("data-rm"), 1); queueSave(); refresh(); return; }
    if (e.target.id === "brandAdd") { addBrand(); return; }
    if (e.target.id === "clear") { have.clear(); brands = []; queueSave(); refresh(); }
    if (e.target.id === "sample") {
      ["vodka", "gin", "rhum_blanc", "bourbon", "tequila", "triple_sec", "vermouth_doux", "campari", "citron", "lime", "sirop", "soda", "tonic", "cola", "orange", "angostura"].forEach(function (i) { have.add(i); });
      queueSave(); refresh();
    }
  });

  elRec.addEventListener("input", function (e) {
    if (e.target.id === "q") { ui.q = e.target.value; ui.limit = 40; fillList(); }
  });
  elRec.addEventListener("click", function (e) {
    if (handleRate(e)) return;
    var lv = e.target.closest("[data-lv]"), av = e.target.closest("[data-av]"), mn = e.target.closest("[data-mn]");
    if (mn) { ui.mine = mn.getAttribute("data-mn"); ui.limit = 40; renderRec(); }
    else if (lv) { ui.level = +lv.getAttribute("data-lv"); ui.limit = 40; renderRec(); }
    else if (av) { ui.avail = av.getAttribute("data-av"); ui.limit = 40; renderRec(); }
    else if (e.target.id === "goBar") setTab("bar");
    else if (e.target.id === "more") { ui.limit += 40; fillList(); }
    else if (e.target.id === "rand") {
      var pool = filtered().filter(function (x) { return x.m.length === 0; });
      if (!pool.length) pool = filtered();
      if (!pool.length) return;
      var pick = pool[Math.floor(Math.random() * pool.length)];
      fillList(pick.c[0]);
      var open = elRec.querySelector("details[open]");
      if (open) open.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });

  elRec.addEventListener("change", handleNote);
  elEnv.addEventListener("change", handleNote);
  elEnv.addEventListener("click", function (e) {
    if (handleRate(e)) return;
    var eb = e.target.closest("[data-eb]"), el = e.target.closest("[data-el]");
    if (eb) { env.base = eb.getAttribute("data-eb"); rebuildQueue(); renderEnv(); }
    else if (el) { env.level = +el.getAttribute("data-el"); rebuildQueue(); renderEnv(); }
    else if (e.target.id === "envNew") { env.newOnly = !env.newOnly; rebuildQueue(); renderEnv(); }
    else if (e.target.id === "envOne") { env.allowOne = !env.allowOne; rebuildQueue(); renderEnv(); }
    else if (e.target.id === "envNext") nextChoice();
    else if (e.target.id === "goBar") setTab("bar");
  });

  /* Démarrage : affichage immédiat, puis chargement du bar enregistré */
  applySaved(lsGet());
  refresh();

  (async function () {
    try {
      var db = await claude.use("db"), user = await claude.use("user");
      if (!db || !user) return;
      var uid = await user.id();
      if (!uid) return;
      dbDoc = db.doc("data/users/" + uid + "/bar");
      var snap = await dbDoc.get();
      if (snap.exists && snap.data()) {
        applySaved(snap.data());
        lsSet(snapshot());
        refresh();
      } else if (have.size || brands.length) {
        dirty = true; flush();
      }
    } catch (e) { dbDoc = null; }
  })();

})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
</body>
